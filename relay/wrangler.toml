# LockedIn relay (v0.1 F-112). Decision O-1: Cloudflare Workers + D1 + Cron, a team-owned account.
# First deploy: see relay/README.md.
name = "lockedin-relay"
main = "src/worker.ts"
compatibility_date = "2026-11-01"

[assets]
directory = "web"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "lockedin-relay"
database_id = "d50a92ce-dbee-4e24-94ec-857a999803de"

[triggers]
crons = ["* * * * *"]

[vars]
# The contact push services see (decided 24 Nov: the public repo, no personal email).
VAPID_SUBJECT = "https://github.com/Jiven-Chana/lockedin-companion"
# Secrets (wrangler secret put): VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY
